<svg width="140" height="140" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg2" cx="35%" cy="28%" r="85%">
      <stop offset="0%" stop-color="#2c6b3f"/>
      <stop offset="100%" stop-color="#1a4425"/>
    </radialGradient>
  </defs>
  <rect width="140" height="140" fill="url(#bg2)"/>

  <!-- scorecard body -->
  <rect x="36" y="34" width="64" height="82" rx="8" fill="#f4efe6"/>

  <!-- golf flag pin, planted into the card like a clip -->
  <rect x="66" y="10" width="4" height="30" rx="2" fill="#f4efe6"/>
  <path d="M70 13 L94 21 L70 29 Z" fill="#d99a3c"/>

  <!-- "GOLF" label under the flag, inside the card -->
  <text x="68" y="52" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-weight="700" font-size="12" letter-spacing="1.5" fill="#1f4d2c">GOLF</text>

  <!-- score rows -->
  <rect x="48" y="62" width="40" height="5" rx="2.5" fill="#c9c2b3"/>
  <rect x="48" y="74" width="40" height="5" rx="2.5" fill="#c9c2b3"/>
  <rect x="48" y="86" width="26" height="5" rx="2.5" fill="#c9c2b3"/>

  <!-- check badge -->
  <circle cx="86" cy="103" r="17" fill="#6fa167"/>
  <path d="M77 103 L83.5 109.5 L96 95" stroke="#f4efe6" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
